[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/api/comprobadas"
  to = "/.netlify/functions/comprobadas"
  status = 200

[[redirects]]
  from = "/api/afiliacion"
  to = "/.netlify/functions/afiliacion"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
